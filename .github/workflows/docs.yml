name: Documentation
on:
  pull_request:
    paths: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
permissions:
  contents: read
jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check merge markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --include='*.md' .; then exit 1; fi
