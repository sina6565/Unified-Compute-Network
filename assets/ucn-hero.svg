<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Unified Compute Network</title>
  <desc id="desc">A global network connecting independent AI providers, compute resources, developers, and users.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b1b"/><stop offset=".55" stop-color="#101b3b"/><stop offset="1" stop-color="#160d2d"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#32d8ff" stop-opacity=".34"/><stop offset="1" stop-color="#32d8ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe6a1"/><stop offset=".5" stop-color="#f3b94f"/><stop offset="1" stop-color="#fff1c7"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#27d7ff" stop-opacity=".15"/><stop offset=".5" stop-color="#8d9cff" stop-opacity=".9"/><stop offset="1" stop-color="#f5c76a" stop-opacity=".25"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="shine"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="240" r="310" fill="url(#glow)"/>
  <circle cx="1090" cy="245" r="180" fill="none" stroke="#50dfff" stroke-opacity=".18" stroke-width="1.5"/>
  <circle cx="1090" cy="245" r="230" fill="none" stroke="#f4c66e" stroke-opacity=".25" stroke-width="1.2" stroke-dasharray="5 12"/>
  <g stroke="url(#line)" stroke-width="2" fill="none" opacity=".9">
    <path d="M850 115 L1000 190 L1195 105 L1320 220 L1190 360 L1000 300 L850 385 L760 250 Z"/>
    <path d="M1000 190 L1090 245 L1195 105 M1090 245 L1320 220 M1090 245 L1190 360 M1090 245 L1000 300 M1090 245 L850 115 M1090 245 L850 385 M1090 245 L760 250"/>
    <path d="M850 115 Q1090 -5 1320 220 M760 250 Q1000 480 1190 360"/>
  </g>
  <g fill="#69e7ff" filter="url(#shine)">
    <circle cx="850" cy="115" r="6"/><circle cx="1000" cy="190" r="5"/><circle cx="1195" cy="105" r="7"/><circle cx="1320" cy="220" r="6"/><circle cx="1190" cy="360" r="7"/><circle cx="1000" cy="300" r="5"/><circle cx="850" cy="385" r="6"/><circle cx="760" cy="250" r="5"/>
  </g>
  <g transform="translate(1090 245)" filter="url(#shine)">
    <circle r="78" fill="#09162b" fill-opacity=".75" stroke="url(#gold)" stroke-width="2.5"/>
    <circle r="58" fill="none" stroke="#48dfff" stroke-opacity=".7" stroke-width="1.5"/>
    <path d="M-50 -15 Q0 -72 50 -15 Q0 42 -50 -15Z M-50 15 Q0 -42 50 15 Q0 72 -50 15Z" fill="none" stroke="#65dcff" stroke-opacity=".8" stroke-width="1.6"/>
    <path d="M-58 0H58 M0 -58V58" stroke="url(#gold)" stroke-width="1.6" opacity=".8"/>
    <circle r="13" fill="url(#gold)"/>
  </g>
  <g fill="#fff" opacity=".8"><circle cx="110" cy="90" r="1.5"/><circle cx="410" cy="60" r="1.4"/><circle cx="630" cy="140" r="1.7"/><circle cx="570" cy="400" r="1.5"/><circle cx="300" cy="330" r="1.4"/><circle cx="1380" cy="80" r="1.5"/><circle cx="1340" cy="430" r="1.4"/></g>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="92" y="176" fill="#7fe7ff" font-size="18" letter-spacing="6" font-weight="700">SINA AI STUDIO INITIATIVE</text>
    <text x="88" y="250" fill="#ffffff" font-size="58" font-weight="800" letter-spacing="1">UNIFIED</text>
    <text x="88" y="316" fill="url(#gold)" font-size="58" font-weight="800" letter-spacing="1">COMPUTE NETWORK</text>
    <text x="92" y="370" fill="#c7d6f2" font-size="21">One network. Open participation. Shared compute.</text>
    <text x="92" y="420" fill="#7e9bbd" font-size="15" letter-spacing="2">AI  •  GPU / CPU  •  STORAGE  •  DEVELOPERS  •  GLOBAL COMMUNITY</text>
